[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saro-dat"
version = "4.6.0"
description = "Distributed Access Token"
keywords = ["dat", "distributed", "access", "token", "jwt", "security", "authentication"]
readme = "README.md"
authors = [{name = "Marker Seoul", email = "j@saro.me"}]
# 3.10 floor: signature.py imports typing.TypeAlias (PEP 613, added in 3.10).
requires-python = ">=3.10"
dependencies = [
    "cryptography>=47.0.0",
]

[project.urls]
"Homepage" = "https://dat.saro.me"
"Repository" = "https://github.com/saro-lab/dat/tree/master/dat-pypi"
"Documentation" = "https://dat.saro.me/ko/libs/pypi-saro-dat"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/saro_dat"]
