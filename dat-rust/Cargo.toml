[package]
name = "dat"
version = "4.6.2"
edition = "2024"
authors = ["marker <j@saro.me>"]
description = "DAT - Distributed Access Token"
repository = "https://github.com/saro-lab/dat"
keywords = ["dat", "distributed", "access", "token", "session"]
homepage = "https://dat.saro.me/"
documentation = "https://dat.saro.me/libs/cargo-dat"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = 'abort'

[features]
default = []
full = ["dat_cms", "tracing"]
dat_cms = ["dep:tokio", "dep:reqwest"]
tracing = ["dep:tracing"]

[dependencies]
itoa = { version = "1.0.18" }
aes-gcm = { version = "0.11.0", features = ["zeroize"] }
# aes-gcm 이 내부에서 쓰는 aes 의 확장 라운드 키까지 drop 시 소거되도록 feature 를 켠다.
aes = { version = "0.9.2", features = ["zeroize"] }
zeroize = { version = "1.9.0" }
base64 = { version = "0.23.1", features = ["alloc", "std"] }
itertools = { version = "0.15.0" }
tokio = { version = "1.53.1", optional = true, default-features = false, features = ["time"] }
reqwest = { version = "0.13.4", optional = true, default-features = false, features = ["native-tls-vendored", "query"] }
tracing = { version = "0.1.44", optional = true }

[target.'cfg(windows)'.dependencies]
aws-lc-rs = { version = "1.18.0", features = ["prebuilt-nasm"] }

[target.'cfg(not(windows))'.dependencies]
aws-lc-rs = { version = "1.18.0" }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
ring = { version = "0.17.14" }
rand = { version = "0.10.2" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
